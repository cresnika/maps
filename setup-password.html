<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Passwort festlegen</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Eigenstaendige, minimale Styles - falls style.css (noch)
       keine .auth-* Klassen enthaelt, greifen diese als Fallback. */
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: var(--bg-sidebar, #1b2420);
      font-family: var(--font-body, system-ui, sans-serif);
    }

    .auth-modal {
      background: var(--bg-sidebar-raised, #222f29);
      color: var(--text, #e8e6df);
      border: 1px solid var(--border, #32433a);
      border-radius: 8px;
      padding: 24px;
      width: 320px;
      max-width: 90vw;
    }

    .auth-modal h2 { margin-top: 0; }

    .auth-view label {
      display: block;
      margin-bottom: 12px;
      font-size: 13px;
      color: var(--text-dim, #93a294);
    }

    .auth-view input {
      display: block;
      width: 100%;
      margin-top: 4px;
      padding: 8px;
      background: var(--bg-sidebar, #1b2420);
      border: 1px solid var(--border, #32433a);
      border-radius: 4px;
      color: var(--text, #e8e6df);
      box-sizing: border-box;
    }

    .auth-view button {
      width: 100%;
      padding: 10px;
      background: var(--accent, #c98a3e);
      border: none;
      border-radius: 4px;
      color: #1b2420;
      font-weight: 600;
      cursor: pointer;
    }

    .auth-view button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .auth-error { color: #e06c6c; font-size: 13px; min-height: 18px; }
    .auth-success { color: #6ce0a0; font-size: 13px; }
    .auth-hint { font-size: 16px; color: var(--text-faint, #8d8f8d); margin-top: 0px; margin-bottom: 12px; }

    .auth-app-link {
      display: inline-block;
      margin-top: 12px;
      color: var(--accent, #c98a3e);
    }
  </style>
</head>
<body>

  <div class="auth-modal">

    <!-- Zustand 1: Formular -->
    <div id="setup-form-view">
      <h1>Passwort festlegen</h1>
      <p class="auth-hint" id="setup-email-display"></p>
      <label>
        Neues Passwort
        <br>
        <input type="password" id="setup-password" autocomplete="new-password">
      </label>
      <p class="auth-hint">Mindestens 8 Zeichen.</p>
      <label>
        Passwort bestätigen
        <br>
        <input type="password" id="setup-password-confirm" autocomplete="new-password">
      </label>
      <p class="auth-error" id="setup-error"></p>
      <button type="button" id="setup-submit">Passwort setzen</button>
    </div>

    <!-- Zustand 2: Ungueltiger/fehlender Token -->
    <div id="setup-invalid-view" style="display:none">
      <h2>Ungültiger Link</h2>
      <p>Dieser Link ist ungültig, abgelaufen oder wurde bereits verwendet.</p>
    </div>

    <!-- Zustand 3: Erfolg -->
    <div id="setup-success-view" style="display:none">
      <h2>Fertig!</h2>
      <p class="auth-success">Dein Passwort wurde gesetzt, du bist jetzt angemeldet.</p>
      <a class="auth-app-link" href="index.html">Zur App →</a>
    </div>

  </div>

  <script>
    const AUTH_API_BASE = 'https://maps.a-cresnik.workers.dev/api/'; // ANPASSEN falls abweichend

    const formView = document.getElementById('setup-form-view');
    const invalidView = document.getElementById('setup-invalid-view');
    const successView = document.getElementById('setup-success-view');
    const errorEl = document.getElementById('setup-error');
    const submitBtn = document.getElementById('setup-submit');
    const passwordInput = document.getElementById('setup-password');
    const passwordConfirmInput = document.getElementById('setup-password-confirm');

    const token = new URLSearchParams(window.location.search).get('token');
    const email = new URLSearchParams(window.location.search).get('email'); 

    if (!token || !email) { 
      formView.style.display = 'none';
      invalidView.style.display = 'block';
    }    

    document.getElementById('setup-email-display').textContent = email;

    submitBtn.addEventListener('click', async () => {
      errorEl.textContent = '';

      const password = passwordInput.value;
      const passwordConfirm = passwordConfirmInput.value;

      if (password.length < 8) {
        errorEl.textContent = 'Passwort muss mindestens 8 Zeichen haben.';
        return;
      }

      if (password !== passwordConfirm) {
        errorEl.textContent = 'Passwörter stimmen nicht überein.';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Wird gespeichert …';

      try {
        const response = await fetch(`${AUTH_API_BASE}set-initial-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ email, token, password }),
        });

        const data = await response.json().catch(() => null);

        if (!response.ok) {
          throw new Error((data && data.error) || `HTTP ${response.status}`);
        }

        formView.style.display = 'none';
        successView.style.display = 'block';
      } catch (err) {
        errorEl.textContent = err.message;
        submitBtn.disabled = false;
        submitBtn.textContent = 'Passwort setzen';
      }
    });

    // Enter-Taste im zweiten Feld soll ebenfalls absenden
    passwordConfirmInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') submitBtn.click();
    });
  </script>

</body>
</html>
