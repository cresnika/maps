name: Update POI database

on:
  workflow_dispatch:

  schedule:
    - cron: "17 3 * * 0"

permissions:
  contents: write

jobs:
  update-pois:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Update POI database
        run: |
          python scripts/update_pois.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/mountain_passes.json

          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "Update mountain passes"
            git push
          fi
